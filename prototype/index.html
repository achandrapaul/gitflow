<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GitFlow — Screen Walkthrough (Mock Only)</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0c1020;color:#eaf0fe}*{box-sizing:border-box}body{margin:0;padding:24px}.app{max-width:1240px;margin:auto;background:#101729;border:1px solid #414d6a;border-radius:13px;overflow:hidden;box-shadow:0 20px 60px #0005}header{display:flex;gap:10px;padding:15px;background:#202a41;align-items:center;justify-content:space-between;flex-wrap:wrap}b.brand{font-size:21px;color:#9df3cb}small{color:#aab8d1}nav{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:#151d30}button{font:inherit;font-size:11px;cursor:pointer;background:#293651;color:#ebf2ff;border:1px solid #536482;padding:8px 10px;border-radius:6px}button:hover,button.active{background:#624b91}button:focus-visible{outline:2px solid #98eac7}.layout{padding:13px;min-height:390px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{border:1px solid #394765;border-radius:8px;overflow:hidden;background:#161f33}.head{padding:10px;background:#222e48;color:#becbea;font-size:11px}.body{padding:10px}.row{display:flex;gap:10px;align-items:center;padding:9px;border-radius:5px;cursor:pointer;border:1px solid transparent;font-size:12px}.row:hover,.row.focus{background:#3c385f;border-color:#7f70ba}.grow{flex:1}.mint{color:#9cedc6}.amber{color:#f9d295}.purple{color:#c9a8ff}.muted{color:#a8b7d1}.pill{display:inline-block;padding:4px 7px;border-radius:5px;background:#2f405c;font-size:10px}.filters,.actions{display:flex;gap:7px;flex-wrap:wrap;padding:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.7;color:#b7c6e0;margin:0}.hint{padding:12px;background:#28283b;border:1px solid #555078;border-radius:7px;font-size:12px;line-height:1.6}.foot{padding:12px 15px;background:#222c44;font-size:11px;color:#c2cfe6}kbd{padding:3px 5px;background:#3a4763;border-radius:4px;color:white}input{background:#0c1425;border:1px solid #64728b;border-radius:4px;padding:9px;color:#eef3ff;width:100%;font:inherit;font-size:12px}.modal{border:1px solid #986a89;padding:17px;background:#32293c;border-radius:8px;max-width:600px;margin:15px auto}.tag{display:inline-block;width:26px;text-align:center;background:#31415c;border-radius:3px;padding:3px}h2{font-size:17px;margin-top:0}.top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:10px;background:#1a263b;margin-bottom:10px;border-radius:7px}#toast{padding:9px 15px;color:#f7dda4;min-height:32px;font-size:11px}@media(max-width:720px){body{padding:5px}.grid{grid-template-columns:1fr}.layout{padding:8px}}
</style></head><body><div class="app" tabindex="0" id="app"><header><b class="brand">gitflow</b><small>INTERACTIVE SCREEN WALKTHROUGH · NO GIT COMMANDS EXECUTED</small></header><nav id="nav"></nav><div class="layout" id="view"></div><div id="toast"></div><div class="foot">Keyboard demo: <kbd>j/k</kbd> Move · <kbd>Space</kbd> Select · <kbd>Enter</kbd> Open · <kbd>a</kbd> Actions · <kbd>Esc</kbd> Back · <kbd>1–4</kbd> File views · <kbd>o</kbd> Paused ops</div></div>
<script>
const names=['Changes','Diff','Commit','History','Actions','Cherry-pick','Rebase','Paused','Conflict','Confirmation','Branch','Help'];let S={page:0,filter:0,focus:0,selected:new Set(),menu:0,notice:'',modal:'',resolved:false,commitmsg:'feat(auth): improve session handling',queue:[0,2],plan:['pick','fixup','pick','squash']};const files=[['src/auth/login.ts','M','M'],['src/auth/session.ts','M',''],['src/ui/Login.tsx','','M'],['tests/auth.test.ts','A',''],['src/utils/token.ts','M','M'],['docs/auth.md','','??']];const commits=[['a81f22e','Add authentication middleware'],['b9213fe','Fix login validation'],['c45d391','Fix refresh token handling'],['d26e420','Add integration tests']];let $=id=>document.getElementById(id),escapeHTML=v=>String(v).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function go(i){S.page=i;S.focus=0;S.notice='';render()}function bk(){if(S.modal){S.modal='';render();return}if(S.page===8)go(7);else if(S.page===1||S.page===2||S.page===10)go(0);else if(S.page===4||S.page===5||S.page===6)go(3);else if(S.page===9)go(7);else go(0)}const which=f=>S.filter===0||S.filter===1&&!!f[1]||S.filter===2&&!f[1]&&!!f[2]||S.filter===3&&!!f[1]&&!!f[2];function bar(){return `<div class="top"><span><b class="mint">● feature/auth</b> @ 7ac91f2 → origin/feature/auth <b class="mint">↑2</b> ↓0</span><span>vs origin/main <b class="mint">↑7</b> <b class="amber">↓3</b> · local refs</span></div>`}function listRows(items,focusFn){return items.map((it,j)=>`<div class="row ${S.focus===j?'focus':''}" data-focus="${j}">${it}</div>`).join('')}
function changes(){let f=files.filter(which);return `${bar()}<div class="filters">${['All','Staged','Not staged','Mixed'].map((x,i)=>`<button class="${S.filter===i?'active':''}" data-filter="${i}">${i+1} ${x}</button>`).join('')}</div><div class="grid"><div class="panel"><div class="head">CHANGED FILES · INDEX / WORKTREE</div><div class="body">${listRows(f.map(x=>`<span class="mint">${S.selected.has(x[0])?'■':'□'}</span><span class="grow">${x[0]}</span><span class="tag">${x[1]||'–'}</span><span class="tag amber">${x[2]||'–'}</span>`))||'<small>No matching files</small>'}</div><div class="head">Selected: ${S.selected.size} · ${f.length} visible</div></div><div class="panel"><div class="head">DIFF PREVIEW · ${f[S.focus]?.[0]||'none'}</div><div class="body"><pre>STAGED · HEAD → INDEX\n<span class="mint">+ validated auth changes</span>\n\nUNSTAGED · INDEX → WORKTREE\n<span class="amber">+ follow-up working tree edit</span></pre><div class="actions"><button data-act="stage">s Stage</button><button data-act="unstage">u Unstage</button><button data-go="1">Enter Full diff</button></div></div></div></div><div class="panel" style="margin-top:11px"><div class="head">COMMIT COMPOSER · staged/index content only</div><div class="body"><small>Subject · 4 staged files (illustrative)</small><input id="subject" value="${escapeHTML(S.commitmsg)}"><div class="actions"><button data-go="2">c c Open composer</button><button data-go="3">Browse history</button><button data-go="10">Inspect branch</button></div></div></div>`}
function history(){return `<h2>Commit History</h2><div class="grid"><div class="panel"><div class="head">HISTORY · paginated batches</div><div class="body">${listRows(commits.map((c,i)=>`<span class="mint">${S.selected.has(c[0])?'■':'□'}</span><span class="purple">●</span><span>${c[0]}</span><span class="grow">${c[1]}</span>`))}</div></div><div class="panel"><div class="head">COMMIT DETAILS</div><div class="body">${commits[S.focus]?.join(' · ')||''}<p class="muted">Enter opens details; Space selects. This preview contains one sample page.</p><div class="actions"><button data-go="4">a Actions</button><button data-go="5">c p Cherry-pick</button><button data-go="6">r i Rebase</button></div></div></div></div>`}
function planner(type){let rebase=type===6;return `<h2>${rebase?'Interactive Rebase Planner':'Cherry-pick Planner'}</h2><p class="muted">${rebase?'feature/auth onto origin/main · explicit affected commit range':'Source commits → currently checked-out target branch'}</p><div class="panel"><div class="head">ORDERED ${rebase?'TODO':'COMMIT QUEUE'} · No Git execution until explicit review</div><div class="body">${listRows((rebase?commits:S.queue.map(i=>commits[i])).map((c,i)=>`<span class="purple">${i+1}</span><span class="grow">${c[0]} · ${c[1]}</span>${rebase?`<button data-cycle="${i}">${S.plan[i]}</button>`:`<button data-up="${i}">↑</button><button data-down="${i}">↓</button>`}`))}</div></div><div class="actions"><button data-act="review">Preview & review</button><button data-go="7">View paused-operation example</button></div>`}
function paused(){return `<h2>Paused Operation · Interactive Rebase</h2><div class="hint">⚠ Rebase paused at 15/20. ${S.resolved?'Demo conflict marked resolved':'2 conflicted paths need resolution'}. Git operation remains paused when leaving this screen.</div><div class="panel" style="margin-top:12px"><div class="head">FILES REQUIRING ATTENTION</div><div class="body">${listRows(['src/auth/session.ts','src/auth/token.ts'].map(x=>`<span class="amber">⚠</span> ${x} <span class="grow"></span> Enter resolve`))}</div></div><div class="actions"><button data-act="continue">c Continue</button><button data-act="skip">s Skip</button><button data-act="abort">A Abort</button><button data-go="0">Esc Back (no abort)</button></div>`}
function conflict(){return `<h2>Conflict Resolver · src/auth/session.ts</h2><div class="grid"><div class="panel"><div class="head">OURS (context-dependent)</div><div class="body"><pre>const timeout = 3000;\nconst retry = true;</pre></div></div><div class="panel"><div class="head">THEIRS (context-dependent)</div><div class="body"><pre>const timeout = 8000;\nconst retry = true;</pre></div></div></div><div class="actions"><button data-act="resolve">1 Ours</button><button data-act="resolve">2 Theirs</button><button data-act="resolve">3 Both</button><button data-act="mark">Mark resolved (demo)</button></div><div class="hint">Selecting a side is not the same as Mark resolved, Continue, or Abort.</div>`}
function confirm(){return `<div class="modal"><h2>Abort interactive rebase?</h2><p>Native command: <code>git rebase --abort</code>. Progress and conflict resolutions may be discarded. Escape cancels; defaults to Cancel.</p><div class="actions"><button data-go="7">Cancel (default)</button><button data-act="fakeAbort">Simulate abort</button></div></div>`}
function generic(){switch(S.page){case 1:return `<h2>Full Diff Inspector</h2><div class="grid"><div class="panel"><div class="head">STAGED · HEAD → INDEX</div><div class="body"><pre>+ staged change</pre></div></div><div class="panel"><div class="head">UNSTAGED · INDEX → WORKTREE</div><div class="body"><pre>+ unstaged change</pre></div></div></div><div class="hint">Space selects hunk/line. s stages, u unstages. This demonstration never mutates Git.</div>`;case 2:return `<h2>Commit Composer / Review</h2><div class="panel"><div class="body"><input placeholder="Commit subject" value="${escapeHTML(S.commitmsg)}"><p class="muted">4 staged files, real product reads the index.</p><button data-act="review">Review commit (demo)</button></div></div>`;case 4:return `<h2>Contextual Actions</h2><div class="panel"><div class="body"><div class="row" data-go="5">Cherry-pick selected <span class="grow"></span> c p</div><div class="row" data-go="6">Interactive rebase <span class="grow"></span> r i</div><div class="row" data-go="3">Esc · Close</div></div></div>`;case 9:return confirm();case 10:return `<h2>Branch Intelligence Inspector</h2>${bar()}<div class="hint">Upstream: origin/feature/auth ↑2 ↓0<br>Comparison base: origin/main ↑7 ↓3<br>Remote-tracking counts are locally known, not live server readings.</div><div class="actions"><button data-act="fetch">Fetch (simulated)</button><button data-go="0">Back</button></div>`;case 11:return `<h2>Keymap / Action help</h2><div class="hint">Enter opens · Space selects · Esc navigates · a actions · c p cherry-pick · r i rebase · o operations · 1–4 Changes filters</div>`;default:return ''}}
function render(){ $('nav').innerHTML=names.map((n,i)=>`<button class="${i===S.page?'active':''}" data-go="${i}">${String(i+1).padStart(2,'0')} ${n}</button>`).join('');$('view').innerHTML=S.page===0?changes():S.page===3?history():S.page===5||S.page===6?planner(S.page):S.page===7?paused():S.page===8?conflict():generic();$('toast').textContent=S.notice||'Demo only. All actions simulate UI transitions; no repository is read or modified.'}
function act(a){if(a==='abort'){go(9);return}if(a==='skip'){S.notice='Skip requires confirmation and native Git in the real app. No Git executed.';render();return}if(a==='continue'){S.notice=S.resolved?'Continue would be attempted by Git after validation. No Git executed.':'Continue disabled: conflicts remain unresolved.';render();return}if(a==='resolve'){S.notice='Conflict-side choice simulated; explicitly mark resolved before continue.';render();return}if(a==='mark'){S.resolved=true;go(7);return}if(a==='fakeAbort'){S.notice='Abort simulated; no Git command executed.';go(0);S.notice='Abort simulated; no Git command executed.';render();return}S.notice=`${a} simulated. No Git command executed.`;render()}
$('app').addEventListener('click',e=>{let t=e.target.closest('[data-go]');if(t){go(+t.dataset.go);return}t=e.target.closest('[data-filter]');if(t){S.filter=+t.dataset.filter;S.focus=0;render();return}t=e.target.closest('[data-focus]');if(t){S.focus=+t.dataset.focus;render();return}t=e.target.closest('[data-act]');if(t){act(t.dataset.act);return}t=e.target.closest('[data-cycle]');if(t){let i=+t.dataset.cycle,acts=['pick','reword','edit','squash','fixup','drop'];S.plan[i]=acts[(acts.indexOf(S.plan[i])+1)%acts.length];render();return}t=e.target.closest('[data-up],[data-down]');if(t){let i=+(t.dataset.up??t.dataset.down),j=i+(t.dataset.up!==undefined?-1:1);if(j>=0&&j<S.queue.length)[S.queue[i],S.queue[j]]=[S.queue[j],S.queue[i]];render()}});
$('app').addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'){if(e.key==='Escape')e.target.blur();return}if(e.key==='Escape'){bk();e.preventDefault();return}if(e.key==='?'||e.key===':'){go(11);return}if(e.key==='o'){go(7);return}if(S.page===0&&['1','2','3','4'].includes(e.key)){S.filter=+e.key-1;S.focus=0;render();return}if(e.key==='j'||e.key==='ArrowDown'||e.key==='k'||e.key==='ArrowUp'){let size=S.page===0?files.filter(which).length:S.page===3?commits.length:S.page===7?2:4;S.focus=Math.min(size-1,Math.max(0,S.focus+(['j','ArrowDown'].includes(e.key)?1:-1)));render();e.preventDefault();return}if(e.key===' '&&(S.page===0||S.page===3)){let id=S.page===0?files.filter(which)[S.focus]?.[0]:commits[S.focus]?.[0];if(id){S.selected.has(id)?S.selected.delete(id):S.selected.add(id);render()}e.preventDefault();return}if(e.key==='Enter'){if(S.page===0)go(1);else if(S.page===3)act('details');else if(S.page===7)go(8);return}if(e.key==='a'){if(S.page===3)go(4);else act('actions');return}if(S.page===7){if(e.key==='c')act('continue');if(e.key==='s')act('skip');if(e.key==='A')act('abort')}if(S.page===8&&['1','2','3'].includes(e.key))act('resolve')});
render();
</script></body></html>
